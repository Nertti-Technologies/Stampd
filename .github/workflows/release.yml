name: Release

# Publishes Stampd's library packages to nuget.org on every `v*` tag push.
# The tag drives the *trigger* but NOT the package version — the version is
# pinned in Directory.Build.props (Version=1.2.0). The workflow asserts the
# tag matches that pinned version so a mis-tagged push doesn't silently ship
# the wrong number.
#
# nuget.org publishing uses Trusted Publishing: the job exchanges its GitHub OIDC token
# for a nuget.org key valid for one hour. No API key is stored. Setup:
#   nuget.org: a Trusted Publishing policy owned by the organisation that owns Stampd.*,
#              Repository Owner Nertti-Technologies, Repository Stampd,
#              Workflow File release.yml, pattern Stampd.*
#   repo:      the NUGET_USER secret holds the policy creator's nuget.org profile name.
#
# Manual dispatch is also enabled:
#   - with no tag: dry-run against main; only `pack` runs, no `push`.
#   - with tag (e.g. v3.0.0) and dry_run=false: publishes that existing tag, to finish
#     a release whose push failed. --skip-duplicate makes a re-run safe.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not push to nuget.org'
        required: false
        default: 'true'
      tag:
        description: 'Existing version tag to build and publish (e.g. v3.0.0); empty = main'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # NuGet.org Trusted Publishing (GitHub OIDC)
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}

    steps:
      - name: Validate tag
        if: env.TAG != ''
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v3.0.0"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Source Link needs full history.
          ref: ${{ env.TAG != '' && format('refs/tags/{0}', env.TAG) || '' }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Stampd targets net10.0. The SDK version comes from global.json.
          global-json-file: global.json

      - name: Print SDK info
        run: dotnet --info

      - name: Restore
        # --locked-mode: fail the restore if any package's resolved version drifts
        # from what's recorded in packages.lock.json. Closes the OSSF Scorecard
        # PinnedDependenciesID "nugetCommand not pinned by hash" finding.
        run: dotnet restore Stampd.slnx --locked-mode

      - name: Build (Release)
        run: dotnet build Stampd.slnx --configuration Release --no-restore

      # Licence-policy gate + attribution drift check: fails if a dependency's licence is not
      # allowed (notices/policy.json) or THIRD-PARTY-NOTICES.txt no longer matches the lock files.
      - name: Third-party notices up to date
        run: dotnet run --project tools/Stampd.Tools.Notices --configuration Release --no-build -- --check

      - name: Test (Stampd.Engine.Tests)
        run: dotnet test tests/Stampd.Engine.Tests/Stampd.Engine.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test (Stampd.WebApi.Tests)
        run: dotnet test tests/Stampd.WebApi.Tests/Stampd.WebApi.Tests.csproj --configuration Release --no-build --verbosity normal

      # Verify the tag matches Directory.Build.props's <Version>. On a dispatch run
      # without a tag, skip the check.
      - name: Verify tag matches pinned version
        if: env.TAG != ''
        shell: bash
        run: |
          # Strip XML comments first so any <Version> mentioned in a <!-- ... --> block
          # (e.g. the pre-release example) doesn't shadow the real declaration.
          STRIPPED=$(perl -0777 -pe 's/<!--.*?-->//gs' Directory.Build.props)
          PINNED=$(echo "$STRIPPED" | grep -oE '<Version>[^<]*</Version>' | head -1 | sed -E 's/<\/?Version>//g')
          VERSION="${TAG#v}"
          echo "Pinned: $PINNED"
          echo "Tag:    $VERSION"
          if [ -z "$PINNED" ]; then
            echo "::error::Could not extract <Version> from Directory.Build.props."
            exit 1
          fi
          if [ "$PINNED" != "$VERSION" ]; then
            echo "::error::Tag v$VERSION does not match Directory.Build.props <Version>$PINNED</Version>. Bump the file or re-tag."
            exit 1
          fi

      - name: Pack
        run: dotnet pack Stampd.slnx --configuration Release --no-build --output ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      # Exchanges this job's GitHub OIDC token for a nuget.org key valid for one hour,
      # so it runs right before the push.
      - name: NuGet login (OIDC)
        id: nuget-login
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          # --skip-duplicate so re-runs of an already-published version are idempotent.
          dotnet nuget push './artifacts/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-${{ github.run_id }}
          path: ./artifacts/*.*nupkg
          retention-days: 30
